# OS dependencies for the Alif Zephyr SDK (sdk-alif).
# Package list from docs/user_guide.pdf, section "Setting Up the Host
# System". Alif only documents/supports Ubuntu for this SDK.

ubuntu_packages: &ubuntu_pkgs
  - build-essential
  - cmake
  - file
  - git
  - libmagic1
  - make
  - ninja-build
  - python3-dev
  - python3-pip
  - python3-setuptools
  - python3-venv
  - python3-wheel
  - wget
  - xz-utils


linux-x86_64:
  ubuntu-26.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs

  ubuntu-24.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs

  ubuntu-22.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs


linux:
  ubuntu-26.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs

  ubuntu-24.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs

  ubuntu-22.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs
