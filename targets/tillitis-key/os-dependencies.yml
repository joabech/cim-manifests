# OS package dependencies for the Tillitis Key QEMU-native build target.
#
# This is a lean set focused on:
#   - LLVM/Clang RISC-V cross-compilation (firmware)
#   - QEMU build (tk1 machine)
#   - Go toolchain (tkey-devtools)

ubuntu_packages: &ubuntu_pkgs
  - build-essential
  - ca-certificates
  - clang
  - clang-format
  - clang-tidy
  - curl
  - git
  - golang-1.23
  - libglib2.0-dev
  - libpixman-1-dev
  - libusb-1.0-0-dev
  - lld
  - llvm
  - make
  - ninja-build
  - perl
  - pkg-config
  - python-is-python3
  - python3
  - python3-dev
  - python3-pip
  - python3-venv

fedora_packages: &fedora_pkgs
  - clang
  - clang-tools-extra
  - cmake
  - curl
  - gcc
  - gcc-c++
  - git
  - glib2-devel
  - golang
  - libusb1-devel
  - llvm
  - make
  - ninja-build
  - perl
  - pixman-devel
  - pkgconfig
  - python3
  - python3-devel
  - python3-pip
  - yosys-devel

# Linux x86_64 (Intel/AMD) dependencies
linux-x86_64:
  ubuntu-26.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs

  ubuntu-24.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs

  ubuntu-22.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs

  fedora-44:
    command: "dnf install"
    packages: *fedora_pkgs

# Linux ARM64 (Apple Silicon, ARM servers) dependencies
linux-aarch64:
  ubuntu-26.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs

  ubuntu-24.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs

  ubuntu-22.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs

  fedora-44:
    command: "dnf install"
    packages: *fedora_pkgs

# Backward compatibility - generic linux (defaults to x86_64 behavior)
linux:
  ubuntu-26.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs

  ubuntu-24.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs

  ubuntu-22.04:
    command: "apt-get install"
    packages: *ubuntu_pkgs

  fedora-44:
    command: "dnf install"
    packages: *fedora_pkgs

macos:
  macos-any:
    command: "brew install"
    packages:
      - clang-format
      - git
      - glib
      - go
      - libusb
      - llvm
      - make
      - meson
      - ninja
      - perl
      - pixman
      - pkgconf
      - python@3
