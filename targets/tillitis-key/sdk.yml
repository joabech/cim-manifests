################################################################################
# Tillitis Key — QEMU-Native Build Manifest
#
# Builds the Tillitis TKey firmware and a patched QEMU (tk1 machine) so that
# the TKey can be emulated on the native host without Docker.
################################################################################

################################################################################
# One-time workspace setup
################################################################################
# Replace the in-tree tkey-libs copy with a symlink to the separately cloned
# repo so that all Makefiles see the same sources.
# Apply out-of-tree patches to upstream repos.
envsetup:
  commands: |
    @echo "Setting up Tillitis Key workspace"
    ln -sfn $(WORKSPACE)/tkey-libs $(WORKSPACE)/tillitis-key1/hw/application_fpga/tkey-libs
    git -C $(WORKSPACE)/tillitis-key1 am --ignore-whitespace $(WORKSPACE)/patches/0001-build-use-lld-for-RISC-V-cross-compilation.patch || true


################################################################################
# Extra files copied into the workspace
################################################################################
copy_files:
  - source: patches/
    dest: patches/


################################################################################
# Top-level Makefile targets
################################################################################

build:
  depends_on:
    - sdk-envsetup
  commands: |
    @echo "Tillitis Key build complete"

test:
  commands: |
    @echo "Tillitis Key tests complete"

clean:
  commands: |
    @echo "Tillitis Key clean complete"


################################################################################
# Git repositories
################################################################################
gits:
  - name: build
    url: https://github.com/Jyx/build.git
    commit: tillitis

  - name: tillitis-key1
    url: https://github.com/tillitis/tillitis-key1.git
    commit: 2ffd46cd31d2d27d69db938535ff970805ddbe5c

  - name: tkey-libs
    url: https://github.com/tillitis/tkey-libs.git
    commit: 53204c7d2f4681ac527674361d6da7bbd517e3bf

  - name: tkey-devtools
    url: https://github.com/tillitis/tkey-devtools.git
    commit: 19e51d67b34e165209bb071a8dec07e243ee228b

  - name: qemu
    url: https://github.com/tillitis/qemu.git
    commit: d8413fe3d93daee611cb737a52819cb2cb89976d
