################################################################################
# Niobium Manifest
#
# Builds the Niobium FHE client stack and the Niobium-based fetch-by-similarity
# benchmark submission.
#
# niobium-client depends on niobium-fhetch, OpenFHE, and nlohmann/json. Instead
# of pulling these in as git submodules under niobium-client/vendor, they are
# checked out separately and connected through the existing Makefile/CMake path
# override mechanisms.
#
# This allows cim to cache each repository independently, making workspace
# creation and incremental builds much faster. It also avoids the repository
# duplication that often comes with heavy use of git submodules.
#
# fetch-by-similarity-submission is the only remaining exception. It keeps its
# own submission/niobium-client submodule because the benchmark harness and
# build files expect that exact path and do not support overrides. Since this
# is the scoring harness, we avoid patching it.
#
# The referenced submodules use the same dependency revisions as the
# repositories checked out above, so the only downside is an extra local copy.
#
# Long term, it would be preferable to move everything to workspace-level
# repositories and eliminate the remaining submodules.
################################################################################

################################################################################
# High-level Makefile targets
################################################################################
envsetup:
  commands: |
    @echo "Niobium build environment ready"


################################################################################
# Copy files section
################################################################################
copy_files:
  - source: README.md
    dest: README.md


################################################################################
# Installation section
################################################################################
install:
  # Initialize submodules once during install. The build step runs repeatedly,
  # so doing it there would cause unnecessary network fetches.
  - name: fetch-by-similarity-submission-submodules
    sentinel: true
    depends_on_gits:
      - fetch-by-similarity-submission
    commands: |
      git -C ${{ FETCH_BY_SIMILARITY_SUBMISSION_DIR }} submodule update --init --recursive


################################################################################
# Gits for the project
################################################################################
gits:
  - name: build
    url: https://github.com/joabech/build.git
    commit: niobium

  # Pinned to the commit niobium-client's vendor/niobium-fhetch submodule
  # points at.
  - name: niobium-fhetch
    url: https://github.com/NiobiumInc/niobium-fhetch.git
    commit: b1934620583f6ecbc470611b1ec8e9c88a9ba102

  # Niobium's OpenFHE fork (nb_main branch). Pinned to the commit
  # niobium-fhetch's vendor/openfhe submodule points at.
  - name: openfhe
    url: https://github.com/NiobiumInc/openfhe-development.git
    commit: 497bd43bdc251f0ecc635b6694243739428fd4cd

  # nlohmann/json, header-only. Pinned to the commit niobium-fhetch's
  # vendor/json submodule points at.
  - name: json
    url: https://github.com/nlohmann/json.git
    commit: 9cca280a4d0ccf0c08f47a99aa71d1b0e52f8d03

  - name: niobium-client
    url: https://github.com/NiobiumInc/niobium-client.git
    commit: main
    build_depends_on:
      - niobium-fhetch
      - openfhe
      - json
    # OPENFHE_DIR / NIOBIUM_CLIENT_FHETCH_DIR / JSON_INCLUDE_DIR are
    # override points niobium-client's own Makefile/CMake already provide
    # (for parent builds like niobium-compiler to inject their own copies
    # instead of syncing niobium-client's vendor/ submodules) - so none of
    # niobium-fhetch/openfhe/json need to live under vendor/ here either.
    #
    # See build/niobium-client.mk (the `build` git above) for the actual
    # release build + dsl_fhe examples recipe, and why it needs -j1.
    build: $(MAKE) niobium-client-build

  # Niobium's AI-agent skill packages
  - name: niobium-skills
    url: https://github.com/NiobiumInc/niobium-skills.git
    commit: main

  - name: fetch-by-similarity-submission
    url: https://github.com/NiobiumInc/fetch-by-similarity-submission.git
    commit: main
    python-deps: requirements.txt
    # This repository keeps its own niobium-client checkout because the
    # scoring/build scripts require it at submission/niobium-client. Required
    # submodules are fetched automatically during installation. See
    # build/fetch-by-similarity-submission.mk for the build process.
    build: $(MAKE) fetch-by-similarity-submission-build
