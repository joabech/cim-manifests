# cmake/git/build-essential build llama.cpp in-workspace (llama-quantize);
# python3-venv is needed for 'cim install pip' to create .cim/build/.venv.
# Declared explicitly so a from-scratch Ubuntu install isn't missing them.
ubuntu_packages: &ubuntu_pkgs
  - cmake
  - git
  - build-essential
  - python3
  - python3-pip
  - python3-venv

linux-x86_64:
  ubuntu-26.04:
    command: "apt install"
    packages: *ubuntu_pkgs
  ubuntu-24.04:
    command: "apt install"
    packages: *ubuntu_pkgs
  ubuntu-22.04:
    command: "apt install"
    packages: *ubuntu_pkgs

linux-aarch64:
  ubuntu-26.04:
    command: "apt install"
    packages: *ubuntu_pkgs
  ubuntu-24.04:
    command: "apt install"
    packages: *ubuntu_pkgs
  ubuntu-22.04:
    command: "apt install"
    packages: *ubuntu_pkgs

macos:
  macos-any:
    command: "brew install"
    packages:
      # Needed to build llama.cpp (build/llama.cpp.mk) in-workspace.
      - cmake
      - git
